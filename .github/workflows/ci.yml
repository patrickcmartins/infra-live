name: ci
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  terraform:
    uses: patrickcmartins/terraform-workflows/.github/workflows/terraform-ci.yml@v1

  # Paridade entre ambientes: stg só prova algo sobre prod se o CÓDIGO for o mesmo.
  # Diferenças permitidas: terraform.tfvars e a chave do state (versions.tf).
  env-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: todo *.tf (exceto versions.tf) idêntico entre stg e prod
        run: |
          diff -u <(cd aws/stg/eks && printf '%s\n' ./*.tf) <(cd aws/prod/eks && printf '%s\n' ./*.tf)
          for f in aws/stg/eks/*.tf; do
            name=$(basename "$f")
            [ "$name" = versions.tf ] && continue
            diff -u "$f" "aws/prod/eks/$name"
          done
      - name: versions.tf difere só na chave do state
        run: |
          diff <(grep -v 'key  *=' aws/stg/eks/versions.tf) <(grep -v 'key  *=' aws/prod/eks/versions.tf)
